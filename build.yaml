# This file generates the GitHub Actions matrix
# For simple board + shield combinations, add them
# to the top level board and shield arrays, for more
# control, add individual board + shield combinations to
# the `include` property, e.g:
#
# board: [ "nice_nano_v2" ]
# shield: [ "corne_left", "corne_right" ]
# include:
#   - board: bdn9_rev2
#   - board: nice_nano_v2
#     shield: reviung41
#
---
include:
  - board: mango_right
  - board: mango_left
  # Flash to both halves before upgrading to clear old pairings
  - board: mango_left
    shield: settings_reset
    # settings_reset disables BLE; the board still forces split on, which breaks the link
    cmake-args: -DCONFIG_ZMK_SPLIT=n
